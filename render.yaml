# LOCATIUM — Render Blueprint
# Frontend stays on Vercel. This file deploys API (+ optional Redis) on Render.
# Docs: https://render.com/docs/blueprint-spec
#
# PostGIS: after the DB is up, run:
#   CREATE EXTENSION IF NOT EXISTS postgis;
# then restore your Haryana dump / run migrations.

services:
  - type: web
    name: locatium-api
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: INVESTOR_CACHE_WARM
        value: "false"
      - key: DATABASE_SSL
        value: "true"
      - key: PG_STATEMENT_TIMEOUT_MS
        value: "60000"
      - key: PG_QUERY_TIMEOUT_MS
        value: "90000"
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: locatium-db
          property: connectionString
      - key: REDIS_URL
        value: ""
      - key: LLM_ENABLED
        value: "false"
      - key: GROQ_API_KEY
        sync: false
      - key: ML_SERVICE_URL
        value: ""

databases:
  - name: locatium-db
    plan: free
    region: singapore
    databaseName: locatium
    user: locatium
    postgresMajorVersion: "16"

name: Keep API awake

# Render's free plan sleeps after ~15 minutes without traffic; the first visitor then waits
# 30–60 s. This pings the liveness endpoint (no database query, so Neon can still sleep).
# Set the repository variable API_URL (Settings → Secrets and variables → Actions → Variables),
# e.g. https://locatium-api.onrender.com
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.API_URL != '' }}
    steps:
      - run: curl -fsS --max-time 90 "${{ vars.API_URL }}/health" || echo "API did not answer (it may be waking up)"
